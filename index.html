<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xCounter</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root { --text:#0f1419; --sub:#536471; --line:#e1e8ed; --bg:#f7f9f9; --blue:#1d9bf0; --red:#f4212e; --green:#00ba7c; }
  * { box-sizing:border-box; }
  body { margin:0; padding:12px 16px; background:var(--bg); color:var(--text);
         font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif; }
  h1 { font-size:18px; margin:2px 4px 10px; }
  h1 span { font-weight:400; color:var(--sub); font-size:13px; margin-left:8px; }
  #summary { display:flex; gap:10px; flex-wrap:wrap; }
  .card { padding:8px 16px; border:1px solid var(--line); border-radius:10px; min-width:120px; background:#fff; }
  .card .t { font-size:12px; color:var(--sub); }
  .card.tb { background:#f3f9fe; border-color:#dcecf9; }   /* 팔로워: 아주 연한 파랑 */
  .card.tr { background:#fef5f5; border-color:#f8e0e1; }   /* 팔로잉: 아주 연한 빨강 */
  .card.tg { background:#f2fbf7; border-color:#d9f1e6; }   /* 게시물: 아주 연한 녹색 */
  .card .v { font-size:22px; font-weight:700; text-align:right; }   /* 숫자는 오른쪽 정렬 */
  .controls { display:flex; gap:32px; flex-wrap:wrap; margin:12px 4px 4px; font-size:14px; }
  .controls label { margin-right:14px; cursor:pointer; }
  #graph { height:calc(100vh - 232px - var(--notice-h, 0px)); min-height:720px; background:#fff; }   /* 공지 높이만큼 더 뺀다 */
  footer { font-size:12px; color:var(--sub); margin:8px 4px; }
  nav.tabs { display:flex; gap:6px; margin:0 4px 10px; }
  nav.tabs a { padding:4px 14px; border:1px solid var(--line); border-radius:999px; background:#fff;
               color:var(--text); text-decoration:none; font-size:13px; }
  nav.tabs a.on { background:var(--text); color:#fff; border-color:var(--text); }
  #notice { background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 12px; margin:0 0 10px; font-size:13px; }
  #notice ul { margin:2px 0 0; padding-left:18px; }
  #notice li { margin:1px 0; }
  #notice .d { color:var(--sub); margin-right:6px; }
  #notice .more { color:var(--blue); cursor:pointer; font-size:12px; }

  /* 휴대폰 화면: 카드를 작게, 한 줄에 4개씩 */
  @media (max-width: 700px) {
    body { padding:8px; }
    h1 { font-size:15px; margin:0 2px 6px; }
    h1 span { display:block; margin:2px 0 0; font-size:11px; }
    #summary { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; }
    .card { min-width:0; padding:3px 5px; border-radius:6px; }
    .card .t { font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card .v { font-size:13px; white-space:nowrap; letter-spacing:-0.3px; }
    .controls { gap:4px 16px; margin:8px 2px 2px; font-size:12px; }
    .controls label { margin-right:8px; white-space:nowrap; }
    #graph { height:calc(100vh - 260px - var(--notice-h, 0px)); min-height:560px; }
    footer { font-size:11px; }
    nav.tabs { margin:0 2px 6px; }
    nav.tabs a { font-size:12px; padding:3px 12px; }
    #notice { font-size:11px; padding:4px 8px; margin-bottom:6px; border-radius:6px; }
    #notice ul { padding-left:14px; }
  }
</style>
</head>
<body>
<h1 id="title">xCounter<span id="sub"></span></h1>
<nav class="tabs"><a class="on" href="./">그래프</a><a href="list.html">기록</a></nav>
<div id="notice" hidden></div>
<div id="summary"></div>
<div class="controls">
  <div><b>기간 </b>
    <label><input type="radio" name="period" value="1d" checked> 1일</label>
    <label><input type="radio" name="period" value="1w"> 1주</label>
    <label><input type="radio" name="period" value="1m"> 1개월</label>
    <label><input type="radio" name="period" value="all"> 전체</label>
    <label><input type="radio" name="period" value="custom"> 직접 선택</label>
  </div>
  <div><b>증감 단위 </b>
    <label><input type="radio" name="bucket" value="raw" checked> 수집 간격</label>
    <label><input type="radio" name="bucket" value="1h"> 1시간</label>
    <label><input type="radio" name="bucket" value="1d"> 1일</label>
  </div>
</div>
<div id="graph"></div>
<footer>마우스 휠 = 확대/축소, 드래그 = 좌우 이동, 더블클릭 = 전체 보기, 팔로워·팔로잉 그래프의 빨간 배경 = 팔로잉이 바뀌었거나, 팔로워가 줄었거나, 새 게시물이 있는 구간</footer>

<script>
// ---------------------------------------------------------------- 설정
const REFRESH_MS = 2 * 60 * 1000;       // 데이터를 다시 받는 주기
const DAY = 864e5;
const PERIODS = { "1d": DAY, "1w": 7 * DAY, "1m": 30 * DAY };
const BUCKETS = { raw: null, "1h": 36e5, "1d": DAY };
const BUCKET_LABEL = { raw: "수집 간격", "1h": "1시간", "1d": "1일" };
const BLUE = "#1d9bf0", RED = "#f4212e", GRAY = "#536471", GREEN = "#00ba7c";

// 시각은 수집한 곳(한국)의 시각 문자열 그대로 다룬다 (방문자 시간대와 무관)
const toMs = s => { s = String(s).trim(); if (s.length === 10) s += " 00:00:00"; return Date.parse(s.replace(" ", "T") + "Z"); };
const toStr = m => new Date(m).toISOString().slice(0, 19).replace("T", " ");

let state = { period: "1d", bucket: "raw", custom: null };
let index = null;            // data/index.json
const months = {};           // "2026-10" -> rows
let rendering = false;
let notices = { notices: [], gaps: [] };   // data/notices.json (공지, 수집 중단 구간)
let noticeOpen = false;

// ---------------------------------------------------------------- 데이터
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const head = lines.shift().split(",");
  const num = v => (v === undefined || v === "") ? null : Number(v);
  const rows = [];
  for (const line of lines) {
    const c = line.split(","), o = {};
    head.forEach((h, i) => o[h] = c[i]);
    const r = { ts: o.timestamp, t: toMs(o.timestamp), followers: num(o.followers), following: num(o.following),
                posts_total: num(o.posts_total), new_posts: num(o.new_posts) };
    if (!isNaN(r.t) && r.followers !== null && r.following !== null) rows.push(r);
  }
  return rows;
}

async function fetchText(url, fresh) {
  const res = await fetch(fresh ? `${url}?t=${Date.now()}` : url, { cache: fresh ? "no-store" : "default" });
  if (!res.ok) throw new Error(`${url}: ${res.status}`);
  return res.text();
}

async function loadIndex() {
  index = JSON.parse(await fetchText("data/index.json", true));
  document.title = `@${index.username} 팔로워·팔로잉`;
  document.getElementById("title").firstChild.textContent = `X@${index.username}의 팔로워·팔로잉의 변화를 알아보자`;
  document.getElementById("sub").textContent = `최근 업데이트 ${index.updated}`;
}

async function loadMonths(list, freshLast) {
  const last = index.months[index.months.length - 1];
  await Promise.all(list.map(async m => {
    if (months[m] && !(freshLast && m === last)) return;
    months[m] = parseCSV(await fetchText(`data/${m}.csv`, m === last));
  }));
}

function allRows() {
  const out = [], seen = new Set();
  for (const m of Object.keys(months).sort()) for (const r of months[m]) if (!seen.has(r.t)) { seen.add(r.t); out.push(r); }
  return out.sort((a, b) => a.t - b.t);
}

async function loadNotices() {
  try { notices = JSON.parse(await fetchText("data/notices.json", true)); }
  catch (e) { notices = { notices: [], gaps: [] }; }
}

const allLoaded = () => index.months.every(m => months[m]);

// ---------------------------------------------------------------- 계산
function bucketLast(rows, key, size) {          // 집계 단위별 마지막 값
  const out = [];
  for (const r of rows) {
    if (r[key] === null) continue;
    const b = size ? Math.floor(r.t / size) * size : r.t;
    if (out.length && out[out.length - 1].t === b) out[out.length - 1].v = r[key];
    else out.push({ t: b, v: r[key] });
  }
  return out;
}

function deltas(rows, key, bucket) {            // 집계 단위별 증감
  const s = bucketLast(rows, key, BUCKETS[bucket]), d = [];
  for (let i = 1; i < s.length; i++) d.push({ t: s[i].t, v: s[i].v - s[i - 1].v });
  return d;
}

function newPostCounts(rows, bucket) {          // 집계 단위별 새 게시물 수
  const size = BUCKETS[bucket];
  const s = rows.filter(r => r.new_posts !== null);
  if (!size) return s.map(r => ({ t: r.t, v: r.new_posts }));
  if (!s.length) return [];
  const sums = new Map();
  for (const r of s) { const b = Math.floor(r.t / size) * size; sums.set(b, (sums.get(b) || 0) + r.new_posts); }
  const out = [], first = Math.floor(s[0].t / size) * size, last = Math.floor(s[s.length - 1].t / size) * size;
  for (let b = first; b <= last; b += size) out.push({ t: b, v: sums.get(b) || 0 });
  return out;
}

function neighborDiffs(vals) {                  // 이전 값과의 차이, 다음 값과의 차이
  const f = v => (v === null || isNaN(v)) ? "–" : (v >= 0 ? "+" : "") + v.toLocaleString("en-US");
  return vals.map((v, i) => [i ? f(v - vals[i - 1]) : "–", i < vals.length - 1 ? f(vals[i + 1] - v) : "–"]);
}

function yRange(vals, includeZero) {
  if (!vals.length) return undefined;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (includeZero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = Math.max((hi - lo) * 0.08, 1);
  return [lo - pad, hi + pad];
}

function visible(points, xr) {                  // 보이는 구간의 값 (없으면 전체)
  if (!xr) return points;
  const part = points.filter(p => p.t >= xr[0] && p.t <= xr[1]);
  return part.length ? part : points;
}

function stems(points, color, name, axis) {     // 0 에서 값까지 세로선
  const x = [], y = [];
  for (const p of points) if (p.v) { x.push(toStr(p.t), toStr(p.t), null); y.push(0, p.v, null); }
  return { x, y, mode: "lines", line: { color, width: 2 }, name, hoverinfo: "skip", showlegend: false, xaxis: "x" + axis, yaxis: "y" + axis };
}

function hoverPoints(points, template, name, axis) {   // 막대 위치에 보이지 않는 점 (마우스가 달라붙게)
  return { x: points.map(p => toStr(p.t)), y: points.map(p => p.v), mode: "markers", marker: { size: 8, opacity: 0 },
           hovertemplate: template, name, showlegend: false, xaxis: "x" + axis, yaxis: "y" + axis };
}

// ---------------------------------------------------------------- 그래프
// 높이 비율: 팔로워 8, 팔로잉 8, 팔로잉 증감 2, 새 게시물 2, 아래 전체 구간 막대 1 (차트 사이 제목 칸은 TITLE_GAP)
const RATIO = [8, 8, 2, 2], SLIDER = 1, TITLE_GAP = 1;
const UNITS = RATIO.reduce((a, b) => a + b) + TITLE_GAP * (RATIO.length - 1);
const DOMAINS = (() => {
  const out = [];
  let top = UNITS;
  for (const r of RATIO) { out.push([Math.max(0, (top - r) / UNITS), top / UNITS]); top -= r + TITLE_GAP; }
  return out;
})();

function buildFigure(rows) {
  const small = window.innerWidth < 700;        // 휴대폰 화면
  const bucket = state.bucket, label = BUCKET_LABEL[bucket];
  const titles = ["팔로워", "팔로잉", `팔로잉 증감 (${label}별)`, `새 게시물 (${label}별)`];
  const layout = {
    template: "plotly_white", hovermode: "x unified", dragmode: "pan", showlegend: false, uirevision: "keep",
    margin: small ? { l: 52, r: 8, t: 26, b: 16 } : { l: 70, r: 30, t: 40, b: 20 },
    paper_bgcolor: "#fff", plot_bgcolor: "#fff",
    font: { family: "'Malgun Gothic','Apple SD Gothic Neo',sans-serif", size: small ? 10 : 12 },
    hoverlabel: { font: { size: small ? 11 : 13 }, bgcolor: "rgba(255,255,255,0.5)" },
    annotations: titles.map((text, i) => ({ text, xref: "paper", yref: "paper", x: 0.5, y: DOMAINS[i][1],
      xanchor: "center", yanchor: "bottom", showarrow: false, font: { size: small ? 12 : 16 } })),
  };
  for (let i = 1; i <= 4; i++) {
    const ax = i === 1 ? "" : i;
    layout["xaxis" + ax] = { anchor: "y" + ax, type: "date", showspikes: false, gridcolor: "#eef1f4",
                             ...(i < 4 ? { matches: "x4", showticklabels: false } : {}) };
    layout["yaxis" + ax] = { domain: DOMAINS[i - 1], anchor: "x" + ax, fixedrange: true, tickformat: ",d", gridcolor: "#eef1f4" };
  }
  if (!rows.length) {
    layout.annotations.push({ text: "데이터 대기 중", xref: "paper", yref: "paper", x: 0.5, y: 0.5, showarrow: false, font: { size: 16 } });
    return { data: [], layout };
  }

  // x 구간
  const lastT = rows[rows.length - 1].t;
  let xr = null;
  if (PERIODS[state.period]) xr = [lastT - PERIODS[state.period], lastT];
  else if (state.period === "custom" && state.custom) xr = state.custom;

  const X = rows.map(r => r.ts);
  const followers = rows.map(r => r.followers), following = rows.map(r => r.following);
  const gaps = notices.gaps || [];
  const gapEnds = new Set(gaps.map(g => g[1]));
  const broken = (ys, cds) => {                 // 수집 중단 구간은 선을 끊는다
    const x = [], y = [], c = [];
    ys.forEach((v, i) => {
      if (i && gapEnds.has(X[i])) { x.push(toStr((toMs(X[i - 1]) + toMs(X[i])) / 2)); y.push(null); c.push(["", ""]); }
      x.push(X[i]); y.push(v); c.push(cds[i]);
    });
    return { x, y, customdata: c };
  };
  const mode = rows.length <= 300 ? "lines+markers" : "lines";
  const hover = "%{y:,d}<br>(이전 대비 %{customdata[0]} · 다음까지 %{customdata[1]})";
  const d = deltas(rows, "following", bucket), posts = newPostCounts(rows, bucket);
  const drops = [];                             // 팔로잉이 바뀌었거나, 팔로워가 줄었거나, 새 게시물이 있는 구간 [시작, 끝] (증감 단위를 따름)
  if (!BUCKETS[bucket]) {
    for (let i = 1; i < rows.length; i++)
      if (rows[i].following !== rows[i - 1].following || rows[i].followers < rows[i - 1].followers || rows[i].new_posts > 0)
        drops.push([rows[i - 1].t, rows[i].t]);
  } else {
    const marked = new Set(d.filter(p => p.v !== 0).map(p => p.t));
    for (const p of deltas(rows, "followers", bucket)) if (p.v < 0) marked.add(p.t);
    for (const p of posts) if (p.v > 0) marked.add(p.t);
    for (const t of [...marked].sort((a, b) => a - b)) drops.push([t, Math.min(t + BUCKETS[bucket], lastT)]);
  }

  const data = [
    { ...broken(followers, neighborDiffs(followers)), name: "팔로워", mode, line: { color: BLUE, width: 2 },
      marker: { size: 4 }, hovertemplate: hover, xaxis: "x", yaxis: "y" },
    { ...broken(following, neighborDiffs(following)), name: "팔로잉", mode, line: { color: RED, width: 2 },
      marker: { size: 4 }, hovertemplate: hover, xaxis: "x2", yaxis: "y2" },
    stems(d.map(p => ({ t: p.t, v: Math.max(p.v, 0) })), BLUE, "증가", 3),
    stems(d.map(p => ({ t: p.t, v: Math.min(p.v, 0) })), RED, "감소", 3),
    hoverPoints(d, "%{y:+,d}", "팔로잉 증감", 3),
    stems(posts, GREEN, "새 게시물", 4),
    hoverPoints(posts, "%{y:,d}개", "새 게시물", 4),
  ];

  // 수집 중단 구간: 회색 띠 + '수집 중단' 글자 (글자에 마우스를 올리면 시각 표시)
  layout.shapes = gaps.map(g => ({ type: "rect", xref: "x4", yref: "paper", x0: g[0], x1: g[1], y0: 0, y1: 1,
                                   fillcolor: "rgba(83,100,113,0.12)", line: { width: 0 }, layer: "below" }));
  for (const g of gaps) layout.annotations.push({ xref: "x4", yref: "paper", x: toStr((toMs(g[0]) + toMs(g[1])) / 2),
    y: DOMAINS[0][1], yanchor: "top", showarrow: false, text: "수집 중단", hovertext: `수집 중단<br>${gapText(g)}`,
    font: { size: small ? 9 : 11, color: GRAY }, bgcolor: "rgba(255,255,255,0.7)" });

  // x 축: 구간은 항상 여기서 지정한 값을 따르게 한다
  Object.assign(layout.xaxis4, { uirevision: String(Date.now()), rangeslider: { visible: true, thickness: SLIDER / UNITS } });
  if (xr) Object.assign(layout.xaxis4, { range: [toStr(xr[0]), toStr(xr[1])], autorange: false });
  else layout.xaxis4.autorange = true;

  // y 축: 보이는 구간에 맞춘다
  const pts = key => rows.map(r => ({ t: r.t, v: r[key] }));
  layout.yaxis.range = yRange(visible(pts("followers"), xr).map(p => p.v));
  layout.yaxis2.range = yRange(visible(pts("following"), xr).map(p => p.v));
  if (drops.length) {                           // 팔로워·팔로잉 그래프 배경을 빨갛게 (선보다 아래에 그림)
    const bx = [];
    const gapMs = gaps.map(g => [toMs(g[0]), toMs(g[1])]);
    const pieces = [];                          // 수집 중단 구간은 빼고 칠한다 (그 사이는 데이터가 없으므로)
    for (const [a0, b0] of drops) {
      let segs = [[a0, b0]];
      for (const [ga, gb] of gapMs)
        segs = segs.flatMap(([a, b]) => (gb <= a || ga >= b) ? [[a, b]] : [[a, Math.min(b, ga)], [Math.max(a, gb), b]].filter(([x, y]) => y > x));
      pieces.push(...segs);
    }
    let cur = null;
    for (const [a, b] of pieces) {
      if (cur && a <= cur[1]) { cur[1] = b; continue; }   // 이어진 구간은 하나로
      if (cur) bx.push(toStr(cur[0]), toStr(cur[0]), toStr(cur[1]), toStr(cur[1]), null);
      cur = [a, b];
    }
    if (cur) bx.push(toStr(cur[0]), toStr(cur[0]), toStr(cur[1]), toStr(cur[1]), null);
    if (bx.length) for (const ax of ["", "2"]) {
      const [lo, hi] = layout["yaxis" + ax].range;
      const by = bx.map((x, i) => x === null ? null : (i % 5 === 1 || i % 5 === 2 ? hi : lo));
      data.unshift({ x: bx, y: by, mode: "lines", fill: "toself", fillcolor: "rgba(244,33,46,0.15)", line: { width: 0 },
                     hoverinfo: "skip", showlegend: false, xaxis: "x" + ax, yaxis: "y" + ax });
    }
  }
  if (d.length) Object.assign(layout.yaxis3, { range: yRange(visible(d, xr).map(p => p.v), true), zeroline: true, zerolinecolor: GRAY });
  if (posts.length) layout.yaxis4.range = yRange(visible(posts, xr).map(p => p.v), true);
  return { data, layout };
}

// ---------------------------------------------------------------- 요약 카드
function changeSince(rows, key, period) {
  const last = rows[rows.length - 1];
  let past = null;
  for (const r of rows) { if (r.t <= last.t - period) past = r; else break; }
  return past ? last[key] - past[key] : null;
}

function card(title, value, color) {
  return `<div class="card"><div class="t">${title}</div><div class="v" style="color:${color || "var(--text)"}">${value}</div></div>`;
}
const fmt = v => v.toLocaleString("en-US");
const deltaCard = (title, v) => v === null ? card(title, "–", GRAY) : card(title, (v >= 0 ? "+" : "") + fmt(v), v >= 0 ? BLUE : RED);

function renderSummary(rows) {
  const el = document.getElementById("summary");
  if (!rows.length) { el.innerHTML = card("데이터", "없음", GRAY); return; }
  const last = rows[rows.length - 1];
  const postsSince = period => rows.filter(r => r.t > last.t - period && r.new_posts !== null).reduce((s, r) => s + r.new_posts, 0);
  const posts24 = postsSince(DAY);
  const postsFor = days => rows[0].t <= last.t - days * DAY ? postsSince(days * DAY) : null;   // 기록이 그만큼 없으면 "–"
  const posts7d = postsFor(7), posts30d = postsFor(30);
  const postsCard = (title, v) => v === null ? card(title, "–", GRAY) : card(title, fmt(v), GREEN);
  el.innerHTML = [
    card("팔로워", fmt(last.followers)),
    deltaCard("팔로워 24시간", changeSince(rows, "followers", DAY)),
    deltaCard("팔로워 7일", changeSince(rows, "followers", 7 * DAY)),
    deltaCard("팔로워 30일", changeSince(rows, "followers", 30 * DAY)),
    card("팔로잉", fmt(last.following)),
    deltaCard("팔로잉 24시간", changeSince(rows, "following", DAY)),
    deltaCard("팔로잉 7일", changeSince(rows, "following", 7 * DAY)),
    deltaCard("팔로잉 30일", changeSince(rows, "following", 30 * DAY)),
    card("게시물", last.posts_total === null ? "–" : fmt(last.posts_total)),
    card("새 게시물 24시간", fmt(posts24), GREEN),
    postsCard("새 게시물 7일", posts7d),
    postsCard("새 게시물 30일", posts30d),
  ].map((h, i) => h.replace('class="card"', `class="card ${["tb", "tr", "tg"][Math.floor(i / 4)]}"`))   // 4개씩 배경색
   .join("");
}

// ---------------------------------------------------------------- 공지
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function gapText(g) {                           // "10-15 08:26 ~ 15:18 (6시간 52분)"
  const min = Math.round((toMs(g[1]) - toMs(g[0])) / 6e4), h = Math.floor(min / 60), m = min % 60;
  const end = g[1].slice(0, 10) === g[0].slice(0, 10) ? g[1].slice(11, 16) : g[1].slice(5, 16);
  return `${g[0].slice(5, 16)} ~ ${end} (${h ? h + "시간 " : ""}${m}분)`;
}

// 수집 중단 사유 (중단 시작 시각 "YYYY-MM-DD HH:MM" 별로 따로 적을 수 있음)
const GAP_REASON = {
  "2026-10-15 08:26": "서버 이전으로 데이터 수집을 잠시 정지하였습니다",
  default: "사정이 생겨서 데이터 수집을 잠시 정지하였습니다",
};

function renderNotices() {
  const el = document.getElementById("notice");
  const items = [
    ...(notices.notices || []).map(n => ({ key: n.date, html: `<span class="d">${esc(n.date)}</span>${esc(n.text)}` })),
    ...(notices.gaps || []).map(g => ({ key: g[0], html: `<span class="d">${g[0].slice(0, 10)}</span>수집 중단: ${gapText(g)} ${GAP_REASON[g[0].slice(0, 16)] || GAP_REASON.default}` })),
  ].sort((a, b) => b.key.localeCompare(a.key));
  const setNoticeH = () => document.documentElement.style.setProperty("--notice-h",
    el.hidden ? "0px" : (el.offsetHeight + parseFloat(getComputedStyle(el).marginBottom)) + "px");   // 그래프 높이 계산용
  if (!items.length) { el.hidden = true; setNoticeH(); return; }
  const SHOW = 3, list = noticeOpen ? items : items.slice(0, SHOW);
  let more = "";
  if (items.length > SHOW) more = `<span class="more">${noticeOpen ? "접기" : `이전 공지 ${items.length - SHOW}개 더 보기`}</span>`;
  el.innerHTML = list.map(i => `<div><b>공지사항 ::</b> ${i.html}</div>`).join("") + more;   // 공지 하나당 한 줄
  el.hidden = false;
  setNoticeH();
  const btn = el.querySelector(".more");
  if (btn) btn.onclick = () => { noticeOpen = !noticeOpen; renderNotices(); };
}

// ---------------------------------------------------------------- 화면 갱신
async function render() {
  if (!index) return;
  // 전체 보기나 불러온 범위보다 앞을 보려면 지난 달 파일도 받는다
  let rows = allRows();
  const needAll = state.period === "all" || (state.period === "custom" && state.custom && rows.length && state.custom[0] < rows[0].t);
  if (needAll && !allLoaded()) { await loadMonths(index.months, false); rows = allRows(); }
  renderSummary(rows);
  renderNotices();
  const { data, layout } = buildFigure(rows);
  rendering = true;
  try { await Plotly.react("graph", data, layout, { scrollZoom: true, displaylogo: false, responsive: true, displayModeBar: window.innerWidth >= 700 }); }
  finally { rendering = false; }
  window.dispatchEvent(new Event("graph-rendered"));   // 세로선 위치 다시 맞춤
}

function parseRelayout(ev) {                    // 그래프 조작에서 x 구간을 꺼낸다
  let lo = null, hi = null;
  for (const [k, v] of Object.entries(ev || {})) {
    if (/^xaxis\d*\.autorange$/.test(k) && v) return "auto";
    if (/^xaxis\d*\.range$/.test(k)) [lo, hi] = v;
    else if (/^xaxis\d*\.range\[0\]$/.test(k)) lo = v;
    else if (/^xaxis\d*\.range\[1\]$/.test(k)) hi = v;
  }
  return lo !== null && hi !== null ? [toMs(lo), toMs(hi)] : null;
}

function syncRadios() {
  for (const name of ["period", "bucket"])
    for (const el of document.querySelectorAll(`input[name=${name}]`)) el.checked = el.value === state[name];
}

async function refresh() {
  try {
    await Promise.all([loadIndex(), loadNotices()]);
    const m = index.months;
    await loadMonths(m.slice(-2), true);       // 최근 두 달 (이번 달은 항상 새로)
    await render();
  } catch (e) { console.error(e); }
}

document.querySelectorAll("input[name=period], input[name=bucket]").forEach(el =>
  el.addEventListener("change", () => { state[el.name] = el.value; render(); }));

(async () => {
  await refresh();
  document.getElementById("graph").on("plotly_relayout", ev => {
    if (rendering) return;
    const p = parseRelayout(ev);
    if (p === "auto") { state.period = "all"; state.custom = null; }
    else if (p) { state.custom = p; state.period = "custom"; }
    else return;
    syncRadios();
    render();
  });
  setInterval(refresh, REFRESH_MS);
  let resizeTimer;                              // 화면 크기가 바뀌면 글자·여백 다시 맞춤
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 300); });
})();

// ---------------------------------------------------------------- 마우스를 따라다니는 세로선
(function () {
  const line = document.createElement("div");
  line.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;border-left:1px solid rgba(83,100,113,0.6);" +
                       "pointer-events:none;z-index:9999;display:none;";
  document.body.appendChild(line);
  let lastX = null;
  function place(x) {
    lastX = x;
    const graph = document.getElementById("graph");
    let top = graph.getBoundingClientRect().top;
    const slider = graph.querySelector(".rangeslider-bg");
    let bottom = slider ? slider.getBoundingClientRect().top : graph.getBoundingClientRect().bottom;
    top = Math.max(top, 0); bottom = Math.min(bottom, window.innerHeight);
    if (bottom <= top) { line.style.display = "none"; return; }
    Object.assign(line.style, { left: x + "px", top: top + "px", height: (bottom - top) + "px", display: "block" });
  }
  document.addEventListener("pointermove", e => { if (e.pointerType === "mouse") place(e.clientX); });   // 실제 마우스만 (터치가 흉내 내는 마우스 이벤트 제외)
  document.documentElement.addEventListener("mouseleave", () => line.style.display = "none");
  // 휴대폰: 손가락으로 누르거나 움직이는 위치를 따라감 (스크롤하면 위치를 다시 맞춤)
  // 휴대폰: 그래프 영역 안을 누를 때만 보임 (카드·버튼을 누르거나 당겨서 새로고침할 땐 숨김)
  const onTouch = e => {
    if (!e.touches.length) return;
    const t = e.touches[0], r = document.getElementById("graph").getBoundingClientRect();
    if (t.clientY < r.top || t.clientY > r.bottom) { line.style.display = "none"; return; }
    place(t.clientX);
  };
  document.addEventListener("touchstart", onTouch, { passive: true });
  document.addEventListener("touchmove", onTouch, { passive: true });
  const replace = () => { if (lastX !== null && line.style.display === "block") place(lastX); };
  window.addEventListener("scroll", replace, { passive: true });
  window.addEventListener("resize", replace);
  window.addEventListener("graph-rendered", replace);         // 카드가 그려진 뒤 위치가 바뀌면 다시 맞춤
  window.addEventListener("pageshow", () => { line.style.display = "none"; lastX = null; });
})();

// ---------------------------------------------------------------- 구간 선택 (PC 전용)
// 왼쪽 버튼 드래그 = 구간 선택 → 그 구간의 팔로워·팔로잉 변동을 카드 옆(그래프 위 오른쪽)에 표시
// 휠 버튼 드래그 = 그래프 좌우 이동, 휠 = 확대/축소, 더블클릭 = 전체 보기
function setupRangeSelect(opts) {
  // opts.getGd()   : plotly 그래프 div
  // opts.getData() : { rows: [{t, followers, following}] (시간순), posts: [{t, v}] }
  // opts.anchor()  : 카드 묶음(#summary) - 결과 상자를 그 오른쪽 빈 곳에 놓음
  // opts.onReset() : 더블클릭 시 전체 보기
  if (!window.matchMedia("(pointer: fine)").matches) return;   // 휴대폰·태블릿은 지금 방식 그대로
  const GAP_MS = 20 * 60e3;                                       // 수집 간격이 이보다 길면 '수집 중단'
  const BLUE = "#1d9bf0", RED = "#f4212e", GRAY = "#536471", GREEN = "#00ba7c";

  const band = document.createElement("div");
  band.style.cssText = "position:fixed;display:none;pointer-events:none;z-index:9998;" +
    "background:rgba(29,155,240,0.12);border-left:1px solid rgba(29,155,240,0.7);border-right:1px solid rgba(29,155,240,0.7);";
  const box = document.createElement("div");
  box.style.cssText = "position:absolute;display:none;z-index:50;background:#fff;border:1px solid #cfe3f5;" +
    "border-radius:10px;padding:5px 12px;font-size:15px;line-height:1.5;color:#0f1419;" +
    "box-shadow:0 1px 4px rgba(0,0,0,0.06);font-variant-numeric:tabular-nums;white-space:nowrap;" +
    "font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;";
  const attachEls = () => document.body ? document.body.append(band, box) : setTimeout(attachEls, 50);
  attachEls();

  let gd = null, sel = null, drag = null;
  const inPlot = t => t.classList && (t.classList.contains("nsewdrag") || t.classList.contains("ewdrag"));   // 차트 안쪽 + 차트 사이 가로축 띠
  const fl = () => gd && gd._fullLayout;
  const xa = () => fl() && fl().xaxis;
  const plotTop = () => gd.getBoundingClientRect().top + fl().yaxis._offset;
  const plotBottom = () => { const y = fl().yaxis4 || fl().yaxis; return gd.getBoundingClientRect().top + y._offset + y._length; };
  const plotLeft = () => gd.getBoundingClientRect().left + xa()._offset;
  const clampX = x => Math.min(Math.max(x, plotLeft()), plotLeft() + xa()._length);
  const msAt = x => xa().p2c(clampX(x) - plotLeft());
  const xAt = ms => plotLeft() + xa().c2p(ms);

  function drawBand(x0, x1) {
    const a = clampX(Math.min(x0, x1)), b = clampX(Math.max(x0, x1));
    const top = Math.max(plotTop(), 0), bottom = Math.min(plotBottom(), window.innerHeight);
    if (b - a < 1 || bottom <= top) { band.style.display = "none"; return; }
    Object.assign(band.style, { left: a + "px", width: (b - a) + "px", top: top + "px", height: (bottom - top) + "px", display: "block" });
  }
  function redraw() {                            // 이동·확대 뒤에도 선택 구간을 따라가게
    if (!gd || !xa() || drag) return;
    if (sel) drawBand(xAt(sel[0]), xAt(sel[1])); else band.style.display = "none";
  }

  // ---- 통계
  const fmt = v => v.toLocaleString("en-US");
  const sgn = v => `<b style="color:${v > 0 ? BLUE : v < 0 ? RED : GRAY}">${v > 0 ? "+" : v < 0 ? "−" : "±"}${fmt(Math.abs(v))}</b>`;
  const hm = ms => { const m = Math.round(ms / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
    return (d ? d + "일 " : "") + (h ? h + "시간 " : "") + (m % 60) + "분"; };
  const tstr = ms => new Date(ms).toISOString().slice(5, 16).replace("T", " ");
  const dstr = ms => new Date(ms).toISOString().slice(0, 16).replace("T", " ").replace(/-/g, "/");   // 2026/11/12 07:50
  function statsHtml(a, b) {                     // 왼쪽: 날짜·시간 / 오른쪽: 팔로워·팔로잉·새 게시물
    const { rows, posts } = opts.getData();
    const r = rows.filter(x => x.t >= a && x.t <= b);
    const close = `<td data-close rowspan="2" style="vertical-align:top;padding-left:14px;color:${GRAY};cursor:pointer">✕</td>`;
    if (r.length < 2) return `<table style="border-collapse:collapse;font-size:inherit"><tr><td><b>${dstr(a)} ~ ${dstr(b)}</b></td>${close}</tr>` +
      `<tr><td style="color:${GRAY}">이 구간에는 비교할 기록이 없습니다 (2개 미만)</td></tr></table>`;
    const f = r[0], l = r[r.length - 1];
    let maxUp = 0, frDown = 0, fgChg = 0, gaps = 0;
    for (let i = 1; i < r.length; i++) {
      const df = r[i].followers - r[i - 1].followers;
      if (df > maxUp) maxUp = df;
      if (df < 0) frDown++;
      if (r[i].following !== r[i - 1].following) fgChg++;
      if (r[i].t - r[i - 1].t > GAP_MS) gaps++;
    }
    const np = posts.filter(p => p.t > f.t && p.t <= l.t).reduce((s, p) => s + p.v, 0);
    const c = (h, st = "") => `<td style="padding:0 0 0 8px;${st}">${h}</td>`;
    const sep = `<td style="width:22px"></td>`;                  // 날짜 칸과 숫자 칸 사이
    const vals = (name, color, a0, a1, extra) =>
      `<td style="color:${color};padding:0">${name}</td>` + c(`${fmt(a0)} → ${fmt(a1)}`, "text-align:right") +
      c(sgn(a1 - a0), "text-align:right") + c(extra, `color:${GRAY}`);
    return `<table style="border-collapse:collapse;font-size:inherit">` +
      `<tr><td style="padding:0"><b>${dstr(f.t)} ~ ${dstr(l.t)}</b></td>${sep}` +
      vals("팔로워", BLUE, f.followers, l.followers, `(최대 +${fmt(maxUp)} · 감소 ${frDown}회)`) +
      c(`<span style="color:${GREEN}">새 게시물</span> <b>${fmt(np)}</b>개`, "padding-left:22px") + close + `</tr>` +
      `<tr><td style="padding:0;color:${GRAY}">${hm(l.t - f.t)}, ${fmt(r.length)}회 데이터, ${gaps}회 중단</td>${sep}` +
      vals("팔로잉", RED, f.following, l.following, `(변동 ${fgChg}회)`) + `<td></td></tr></table>`;
  }
  function placeBox() {      // ① 카드 마지막 줄 오른쪽 빈 곳 ② 기간·증감 단위 줄 오른쪽 ③ 그래프 안 오른쪽 위
    if (box.style.display === "none") return;
    const anc = opts.anchor(), g = gd.getBoundingClientRect(), sx = window.scrollX, sy = window.scrollY;
    const w = box.offsetWidth;
    const spot = els => {                          // 그 줄에서 내용이 끝나는 곳과 줄의 위쪽
      let right = 0, top = 0;
      if (els.length) { top = els[els.length - 1].getBoundingClientRect().top;
        for (const e of els) { const rc = e.getBoundingClientRect(); if (Math.abs(rc.top - top) < 4) right = Math.max(right, rc.right); } }
      return { ok: els.length && g.right - right - 16 >= w, top };
    };
    const a = spot(anc ? [...anc.children] : []);
    const ctl = anc && anc.nextElementSibling, b = spot(ctl ? [...ctl.children] : []);
    let top;
    if (a.ok) top = a.top;
    else if (b.ok) top = b.top - 4;
    else top = plotTop() + 4;
    Object.assign(box.style, { left: (g.right - w - (a.ok || b.ok ? 0 : 8) + sx) + "px", top: (top + sy) + "px" });
  }
  function showStats() {
    if (!sel) { box.style.display = "none"; return; }
    box.innerHTML = statsHtml(sel[0], sel[1]);
    box.style.display = "block";
    placeBox();
  }
  function clear() { sel = null; band.style.display = "none"; box.style.display = "none"; }
  box.addEventListener("click", e => { if (e.target.closest("[data-close]")) clear(); });

  // ---- 마우스
  function onDown(e) {
    if (!e.isTrusted || !xa()) return;                       // 아래에서 넘겨주는 가짜 이벤트는 그대로 통과
    const t = e.target;
    if (!inPlot(t)) return;                                    // 차트 안쪽만 (아래 범위 막대·세로축은 그대로)
    if (e.button === 1) {                                      // 휠 버튼 → 기존 '이동' 동작으로 넘김
      e.preventDefault(); e.stopPropagation();
      t.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true, view: window,
        clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY, button: 0, buttons: 1 }));
      return;
    }
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();                   // 왼쪽 버튼 → 구간 선택
    drag = { x0: e.clientX };
    drawBand(e.clientX, e.clientX);
  }
  document.addEventListener("mousemove", e => { if (drag) drawBand(drag.x0, e.clientX); });
  document.addEventListener("mouseup", e => {
    if (!drag || e.button !== 0) return;
    const x0 = drag.x0; drag = null;
    if (Math.abs(e.clientX - x0) < 4) { clear(); return; }   // 그냥 클릭 = 선택 해제
    const a = msAt(x0), b = msAt(e.clientX);
    sel = [Math.min(a, b), Math.max(a, b)];
    redraw(); showStats();
  });
  function onDbl(e) {
    if (!inPlot(e.target)) return;
    e.preventDefault(); e.stopPropagation();
    clear(); opts.onReset();
  }
  window.addEventListener("scroll", redraw, { passive: true });
  window.addEventListener("resize", () => { redraw(); placeBox(); });

  (function attach() {                            // 그래프가 그려지면 한 번만 연결
    const g = opts.getGd();
    if (g && g._fullLayout && g.on && !g._rangeSelect) {
      gd = g; g._rangeSelect = true;
      g.addEventListener("mousedown", onDown, true);
      g.addEventListener("dblclick", onDbl, true);
      g.on("plotly_relayouting", redraw);
      g.on("plotly_afterplot", () => { redraw(); if (sel) showStats(); });
    }
    setTimeout(attach, 1000);
  })();
}

setupRangeSelect({
  getGd: () => document.getElementById("graph"),
  getData: () => {
    const rows = allRows();
    return { rows, posts: rows.filter(r => r.new_posts > 0).map(r => ({ t: r.t, v: r.new_posts })) };
  },
  anchor: () => document.getElementById("summary"),
  onReset: () => { state.period = "all"; state.custom = null; syncRadios(); render(); },
});
if (window.matchMedia("(pointer: fine)").matches) {   // PC: 안내 문구도 바뀐 조작에 맞춤
  const f = document.querySelector("footer");
  f.textContent = f.textContent.replace("드래그 = 좌우 이동", "드래그 = 구간 선택, 휠 버튼 드래그 = 좌우 이동");
}
